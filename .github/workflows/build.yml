name: build-immortalwrt-rockpi-e

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-dev python3-pip python3-pyelftools \
            python3-setuptools rsync swig unzip zip zlib1g-dev file subversion upx-ucl \
            patchelf gcc-multilib g++-multilib

      - name: Clone ImmortalWrt 24.10.6 source
        run: |
          git clone --depth=1 -b v24.10.6 https://github.com/immortalwrt/immortalwrt.git /tmp/immortalwrt

      - name: Apply custom packages and config
        run: |
          cd /tmp/immortalwrt
          # custom plugin: campusauth 2.0.3
          cp -r $GITHUB_WORKSPACE/package/luci-app-campusauth package/
          # default Chinese LuCI settings
          mkdir -p files
          cp -r $GITHUB_WORKSPACE/files/* files/
          # build config
          cp $GITHUB_WORKSPACE/.config .config
          # iStore src-link (pinned commit)
          git clone --depth=1 https://github.com/linkease/istore.git /tmp/istore-src
          cd /tmp/istore-src && git fetch --depth=1 origin 3fca15b30aeed9ecacb3efc8b4a8b9c2584ad5c7 && git checkout FETCH_HEAD
          echo "src-link istore /tmp/istore-src" >> /tmp/immortalwrt/feeds.conf
          cd /tmp/immortalwrt
          # UA2F required kernel config
          echo "CONFIG_NETFILTER_NETLINK_GLUE_CT=y" >> target/linux/rockchip/armv8/config-6.6
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make -j$(nproc) > /tmp/build.log 2>&1 || { make -j1 V=s >> /tmp/build.log 2>&1; exit 1; }

      - name: Collect error tail on failure
        if: failure()
        run: |
          tail -n 200 /tmp/build.log > /tmp/build-error.log || true
          echo "--- disk space ---" >> /tmp/build-error.log
          df -h >> /tmp/build-error.log 2>&1 || true
          echo "--- target dir ---" >> /tmp/build-error.log
          ls -la /tmp/immortalwrt/bin/targets/rockchip/armv8/ 2>/dev/null | head -20 >> /tmp/build-error.log || true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            /tmp/immortalwrt/bin/targets/rockchip/armv8/*.img.gz
            /tmp/immortalwrt/bin/targets/rockchip/armv8/*.manifest
            /tmp/immortalwrt/bin/targets/rockchip/armv8/sha256sums
            /tmp/immortalwrt/bin/targets/rockchip/armv8/config.buildinfo
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }} - ${{ job.status }}
          body: |
            ${{ job.status == 'success' && 'Firmware build succeeded. Download the .img.gz and verify SHA-256.' || 'Build failed. Error log attached (if present).' }}
          files: |
            /tmp/immortalwrt/bin/targets/rockchip/armv8/*.img.gz
            /tmp/immortalwrt/bin/targets/rockchip/armv8/*.manifest
            /tmp/immortalwrt/bin/targets/rockchip/armv8/sha256sums
            /tmp/immortalwrt/bin/targets/rockchip/armv8/config.buildinfo
            /tmp/build-error.log
          fail_on_unmatched_files: false
